<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>justshowmediff</title>
<!-- OG_PLACEHOLDER -->
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-brand">Diff Review</span>
  <div class="toolbar-sep"></div>
  <div class="file-pills" id="file-pills"></div>
  <div class="toolbar-stats">
    <span id="s-files">0 files</span>
    <span class="s-add" id="s-add">+0</span>
    <span class="s-del" id="s-del">-0</span>
  </div>
</div>

<div class="main">
  <div class="panel-left">
    <div class="panel-section empty" id="files-panel"></div>
  </div>

  <div class="canvas">
    <div class="paste-overlay" id="paste-overlay">
      <div class="paste-card">
        <h2>Paste a git diff</h2>
        <p><span class="k">git diff | pbcopy</span> then <span class="k">Cmd+V</span></p>
      </div>
    </div><!-- /paste-overlay -->

    <div class="progress-strip" id="progress-strip">
      <div class="p-dots" id="p-dots"></div>
      <div class="p-bar"><div class="p-bar-fill" id="p-fill"></div></div>
      <span class="p-label" id="p-label">0/0</span>
    </div>

    <div class="ctx-bar" id="ctx-bar" style="display:none">
      <div class="ctx-bar-left">
        <span class="ctx-bar-file" id="ctx-file"></span>
        <div class="ctx-bar-badges" id="ctx-badges"></div>
      </div>
      <div class="ctx-bar-actions">
        <button class="mode-btn" id="mb-collapse" onclick="toggleCollapseContext()">Collapse</button>
        <button class="mode-btn" id="mb-focus" onclick="toggleFocusMode()">Focus</button>
      </div>
    </div>

    <div class="col-labels" id="col-labels" style="display:none">
      <div class="col-label">Removed</div>
      <div class="col-label">Added</div>
    </div>

    <div style="display:flex;flex:1;overflow:hidden;position:relative">
      <div class="diff-scroll" id="diff-scroll" style="display:none">
        <div class="diff-wrap">
          <div class="diff-pane diff-pane-l" id="dl"></div>
          <div class="diff-pane" id="dr"></div>
        </div>
      </div>

      <div class="float-bar" id="float-bar">
        <span class="hint"><span class="k">&larr;</span><span class="k">&rarr;</span> files</span>
        <span class="hint"><span class="k">F</span> focus</span>
        <span class="hint"><span class="k">R</span> revert</span>
        <div class="sep"></div>
        <button onclick="copyRevert()">Copy revert cmd</button>
        <button onclick="clearAll()">Reset</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let S = {
  files: [], active: 0, comments: {}, editing: null,
  reviewed: {}, reverted: {}, focus: true, collapse: false, expanded: {},
};

function parseDiff(raw) {
  const files = [], lines = raw.split('\n');
  let cf = null, ch = null, ol = 0, nl = 0;
  for (const l of lines) {
    if (l.startsWith('diff --git')) { const gm = l.match(/diff --git a\/(.+) b\//); cf = { file: gm ? gm[1] : '', hunks:[], add:0, del:0, status:'modified' }; files.push(cf); continue; }
    if (!cf) continue;
    if (l.startsWith('new file')) { cf.status = 'added'; continue; }
    if (l.startsWith('deleted file')) { cf.status = 'deleted'; continue; }
    if (l.startsWith('rename from')) { cf.status = 'renamed'; continue; }
    if (l.startsWith('rename to')) { continue; }
    if (l.startsWith('---')) continue;
    if (l.startsWith('+++')) { const fn = l.replace(/^\+\+\+\s+[ab]\//,'').replace(/^\+\+\+\s+/,''); if (fn !== '/dev/null') cf.file = fn; continue; }
    if (l.startsWith('@@')) { const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)/); if (m&&cf) { ol=+m[1]; nl=+m[2]; ch={header:l,ctx:m[3].trim(),lines:[]}; cf.hunks.push(ch); } continue; }
    if (!ch) continue;
    if (l.startsWith('+')) { ch.lines.push({t:'addition',o:null,n:nl,c:l.substring(1)}); nl++; if(cf)cf.add++; }
    else if (l.startsWith('-')) { ch.lines.push({t:'deletion',o:ol,n:null,c:l.substring(1)}); ol++; if(cf)cf.del++; }
    else if (l.startsWith('\\')) {}
    else { ch.lines.push({t:'context',o:ol,n:nl,c:l.substring(1)}); ol++; nl++; }
  }
  return files;
}

function pairs(lines) {
  const p = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.t==='context') { p.push({l:l,r:l}); i++; }
    else if (l.t==='deletion') {
      const d=[],a=[];
      while(i<lines.length&&lines[i].t==='deletion'){d.push(lines[i]);i++;}
      while(i<lines.length&&lines[i].t==='addition'){a.push(lines[i]);i++;}
      const mx=Math.max(d.length,a.length);
      for(let j=0;j<mx;j++) p.push({
        l:j<d.length?d[j]:{t:'empty',o:null,n:null,c:''},
        r:j<a.length?a[j]:{t:'empty',o:null,n:null,c:''},
      });
    } else if (l.t==='addition') { p.push({l:{t:'empty',o:null,n:null,c:''},r:l}); i++; }
    else i++;
  }
  return p;
}

function wdiff(a,b) {
  if(!a||!b) return {oh:esc(a),nh:esc(b)};
  const at=tok(a),bt=tok(b),lc=lcs(at,bt);
  let ai=0,bi=0,li=0,oh='',nh='';
  while(ai<at.length||bi<bt.length) {
    if(li<lc.length&&ai<at.length&&bi<bt.length&&at[ai]===lc[li]&&bt[bi]===lc[li]) { oh+=esc(at[ai]);nh+=esc(bt[bi]);ai++;bi++;li++; }
    else {
      if(ai<at.length&&(li>=lc.length||at[ai]!==lc[li])){oh+=`<span class="wh">${esc(at[ai])}</span>`;ai++;}
      if(bi<bt.length&&(li>=lc.length||bt[bi]!==lc[li])){nh+=`<span class="wh">${esc(bt[bi])}</span>`;bi++;}
    }
  }
  return {oh,nh};
}
function tok(s){return s.match(/\S+|\s+/g)||[];}
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Uint16Array(n+1));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);const r=[];let i=m,j=n;while(i>0&&j>0){if(a[i-1]===b[j-1]){r.unshift(a[i-1]);i--;j--;}else if(d[i-1][j]>d[i][j-1])i--;else j--;}return r;}

/* SYNTAX_PLACEHOLDER */

function unesc(s) {
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
}

function isReviewed(i){return !S.reverted[i]&&(S.reviewed[i]||Object.keys(S.comments).some(k=>k.startsWith(i+'-')&&S.comments[k]));}

function render(){renderPills();renderFiles();renderDiff();renderStats();renderProgress();showBar();}

function renderPills() {
  const el = document.getElementById('file-pills');
  if (!S.files.length) { el.innerHTML=''; return; }
  el.innerHTML = S.files.map((f,i) => {
    const nm = f.file.split('/').pop(), rv=!!S.reverted[i], re=isReviewed(i);
    let dot = '';
    if(rv) dot='<span class="pill-dot reverted"></span>';
    else if(re) dot='<span class="pill-dot reviewed"></span>';
    return `<div class="file-pill ${i===S.active?'active':''}" onclick="sel(${i})">${dot}${esc(nm)}<span class="pill-stats">+${f.add} -${f.del}</span></div>`;
  }).join('');
}

function renderFiles() {
  const p = document.getElementById('files-panel');
  if(!S.files.length){p.classList.add('empty');p.innerHTML='';return;}
  p.classList.remove('empty');
  const rc=Object.keys(S.reverted).length;

  // Group files by directory
  const tree = {};
  S.files.forEach((f,i) => {
    const parts = f.file.split('/');
    const dir = parts.length > 1 ? parts.slice(0,-1).join('/') : '.';
    if (!tree[dir]) tree[dir] = [];
    tree[dir].push(i);
  });

  const dirs = Object.keys(tree).sort();
  let h='<div class="panel-title">Files ('+S.files.length+')</div>';

  for (const dir of dirs) {
    if (dirs.length > 1 || dir !== '.') {
      h += `<div class="tree-dir">${esc(dir)}/</div>`;
    }
    for (const i of tree[dir]) {
      const f = S.files[i], nm = f.file.split('/').pop(), rv = !!S.reverted[i];
      const active = i === S.active ? ' active' : '';
      const sc = f.status === 'added' ? 'st-added' : f.status === 'deleted' ? 'st-deleted' : f.status === 'renamed' ? 'st-renamed' : 'st-modified';
      const sl = f.status === 'added' ? 'A' : f.status === 'deleted' ? 'D' : f.status === 'renamed' ? 'R' : 'M';
      h += `<div class="file-row${active}" onclick="sel(${i})"><span class="file-st ${sc}">${sl}</span><span class="file-row-name ${rv?'struck':''}" title="${esc(f.file)}">${esc(nm)}</span><span class="file-row-stats">+${f.add} -${f.del}</span></div>`;
    }
  }
  if(rc>0&&rc<S.files.length) h+=`<button class="revert-all" onclick="revAll()">Revert all</button>`;
  p.innerHTML=h;
}

function renderProgress() {
  const el=document.getElementById('progress-strip');
  if(!S.files.length){el.classList.remove('active');return;}
  el.classList.add('active');
  const rc=Object.keys(S.reverted).length, tot=S.files.length-rc;
  const rev=S.files.filter((_,i)=>isReviewed(i)).length;
  document.getElementById('p-dots').innerHTML=S.files.map((_,i)=>{let c='pending';if(S.reverted[i])c='reverted';else if(i===S.active)c='current';else if(isReviewed(i))c='reviewed';return `<span class="p-dot ${c}" onclick="sel(${i})" title="${S.files[i].file}"></span>`;}).join('');
  document.getElementById('p-fill').style.width=(tot>0?rev/tot*100:0)+'%';
  document.getElementById('p-label').textContent=rev+'/'+tot;
}

function renderDiff() {
  if(!S.files.length)return;
  const f=S.files[S.active],rv=!!S.reverted[S.active];
  document.getElementById('ctx-bar').style.display='flex';
  document.getElementById('ctx-file').textContent=f.file;
  const bg=document.getElementById('ctx-badges');
  let bh='';
  if(rv) bh+='<span class="badge-sm badge-reverted">REVERTED</span>';
  bg.innerHTML=bh;
  document.getElementById('mb-focus').classList.toggle('on',S.focus);
  document.getElementById('mb-collapse').classList.toggle('on',S.collapse);
  document.getElementById('col-labels').style.display='flex';
  document.getElementById('diff-scroll').style.display='block';
  document.getElementById('diff-scroll').classList.toggle('focus-on',S.focus);

  if(rv){document.getElementById('dl').innerHTML='';document.getElementById('dr').innerHTML=`<div class="reverted-view"><div>Marked for revert</div><span onclick="undoRev(${S.active})">undo</span></div>`;return;}
  S.reviewed[S.active]=true;
  let lh='',rh='';

  for(let hi=0;hi<f.hunks.length;hi++){
    const hk=f.hunks[hi],lb=esc(hk.ctx||hk.header);
    lh+=`<div class="hunk-row">${lb}</div>`;rh+=`<div class="hunk-row">${lb}</div>`;
    const ps=pairs(hk.lines);let cs=-1,cc=0;
    for(let pi=0;pi<ps.length;pi++){
      const pr=ps[pi],ic=pr.l.t==='context',nc=pi+1<ps.length&&ps[pi+1].l.t==='context';
      if(S.collapse&&ic){if(cs===-1)cs=pi;cc++;if(!nc||pi===ps.length-1){if(cc>3){emit(ps[cs],hi);const ek=S.active+'-'+hi+'-'+cs;if(S.expanded[ek]){for(let ci=cs+1;ci<cs+cc-1;ci++)emit(ps[ci],hi);}else{const n=cc-2;lh+=`<div class="fold-row" onclick="expand('${ek}')">... ${n} line${n!==1?'s':''} ...</div>`;rh+=`<div class="fold-row" onclick="expand('${ek}')">... ${n} line${n!==1?'s':''} ...</div>`;}emit(ps[cs+cc-1],hi);}else{for(let ci=cs;ci<cs+cc;ci++)emit(ps[ci],hi);}cs=-1;cc=0;}continue;}
      cs=-1;cc=0;emit(pr,hi);
    }
  }

  function emit(pr,hi){
    const id=S.active+'-'+(pr.r.n??'x')+'-'+(pr.l.o??'x'),hc=!!S.comments[id],ed=S.editing===id;
    let lc,rc;const lang=getLang(f.file);
    if(pr.l.t==='deletion'&&pr.r.t==='addition'){const w=wdiff(pr.l.c,pr.r.c);lc=shHtml(w.oh,lang);rc=shHtml(w.nh,lang);}else{lc=hilite(pr.l.c,lang);rc=hilite(pr.r.c,lang);}
    lh+=`<div class="d-line ${pr.l.t}" data-line-id="${id}"><div class="d-num">${pr.l.o??''}</div><div class="d-code">${lc}</div></div>`;
    rh+=`<div class="d-line ${pr.r.t} ${hc?'has-comment':''}" data-line-id="${id}"><button class="cmt-btn" onclick="event.stopPropagation();openCmt('${id}')"></button><div class="d-num">${pr.r.n??''}</div><div class="d-code">${rc}</div></div>`;
    if(ed){
      rh+=`<div class="cmt-inline"><textarea id="ta-${id}" placeholder="Add a note...">${esc(S.comments[id]||'')}</textarea><div class="cmt-actions">${hc&&S.comments[id]?'<button class="del" onclick="delCmt(\''+id+'\')">Delete</button>':''}<button onclick="cancelCmt()">Cancel</button><button class="save" onclick="saveCmt('${id}')">Save</button></div></div>`;
      lh+=`<div class="cmt-inline" style="visibility:hidden;pointer-events:none"><textarea style="min-height:48px"></textarea><div class="cmt-actions"><button>x</button></div></div>`;
    } else if(hc&&S.comments[id]){
      rh+=`<div class="cmt-saved"><div class="cmt-saved-text">${esc(S.comments[id])}</div><div class="cmt-saved-acts"><button onclick="editCmt('${id}')">edit</button><button onclick="delCmt('${id}')">delete</button></div></div>`;
      lh+=`<div class="cmt-saved" style="visibility:hidden;pointer-events:none"><div class="cmt-saved-text">&nbsp;</div></div>`;
    }
  }

  document.getElementById('dl').innerHTML=lh;document.getElementById('dr').innerHTML=rh;
  const dl=document.getElementById('dl'),dr=document.getElementById('dr');let sy=false;
  dl.onscroll=()=>{if(!sy){sy=true;dr.scrollTop=dl.scrollTop;sy=false;}};
  dr.onscroll=()=>{if(!sy){sy=true;dl.scrollTop=dr.scrollTop;sy=false;}};
  if(S.editing){const ta=document.getElementById('ta-'+S.editing);if(ta){ta.focus();ta.selectionStart=ta.value.length;}}
}

function renderStats(){
  let a=0,d=0;S.files.forEach((f,i)=>{if(S.reverted[i])return;a+=f.add;d+=f.del;});
  const ac=S.files.length-Object.keys(S.reverted).length;
  document.getElementById('s-files').textContent=ac+(ac===1?' file':' files');
  document.getElementById('s-add').textContent='+'+a;document.getElementById('s-del').textContent='-'+d;
}
function showBar(){const b=document.getElementById('float-bar');if(!S.files.length)b.classList.remove('active');else b.classList.add('active');}

function copyRevert(){
  const rf=Object.keys(S.reverted).map(i=>S.files[i]?.file).filter(Boolean);
  if(!rf.length){showToast('No files marked for revert');return;}
  const cmd='git checkout HEAD -- '+rf.join(' ');
  navigator.clipboard.writeText(cmd).then(()=>showToast('Copied: '+cmd));
}

function sel(i){S.active=i;S.editing=null;render();}
function toggleFocusMode(){S.focus=!S.focus;renderDiff();}
function toggleCollapseContext(){S.collapse=!S.collapse;S.expanded={};renderDiff();}
function expand(k){S.expanded[k]=true;renderDiff();}
function rev(i){S.reverted[i]=true;render();showToast('Marked '+S.files[i].file.split('/').pop()+' for revert');}
function undoRev(i){delete S.reverted[i];render();}
function revAll(){S.files.forEach((_,i)=>{S.reverted[i]=true;});render();showToast('All files marked for revert');}
function openCmt(id){S.editing=id;if(!S.comments[id])S.comments[id]='';renderDiff();}
function editCmt(id){S.editing=id;renderDiff();}
function saveCmt(id){const ta=document.getElementById('ta-'+id);if(ta){const v=ta.value.trim();if(v)S.comments[id]=v;else delete S.comments[id];}S.editing=null;render();}
function cancelCmt(){const id=S.editing;if(id&&!S.comments[id])delete S.comments[id];S.editing=null;renderDiff();}
function delCmt(id){delete S.comments[id];S.editing=null;render();}
function clearAll(){
  S={files:[],active:0,comments:{},editing:null,reviewed:{},reverted:{},focus:true,collapse:false,expanded:{}};
  document.getElementById('paste-overlay').classList.remove('hidden');
  document.getElementById('ctx-bar').style.display='none';
  document.getElementById('col-labels').style.display='none';
  document.getElementById('diff-scroll').style.display='none';
  document.getElementById('progress-strip').classList.remove('active');
  document.getElementById('float-bar').classList.remove('active');
  render();
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}

document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='TEXTAREA'){if(e.key==='Escape')cancelCmt();if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&S.editing){e.preventDefault();saveCmt(S.editing);}return;}
  if(!S.files.length)return;
  if(e.key==='ArrowRight'&&S.active<S.files.length-1)sel(S.active+1);
  if(e.key==='ArrowLeft'&&S.active>0)sel(S.active-1);
  if(e.key==='f')toggleFocusMode();
  if(e.key==='c')toggleCollapseContext();
  if(e.key==='r')rev(S.active);
  if(e.key==='u')undoRev(S.active);
  if(e.key==='Escape')cancelCmt();
});

document.addEventListener('paste',(e)=>{
  if(e.target.tagName==='TEXTAREA')return;
  const t=e.clipboardData.getData('text');if(!t||!t.includes('diff --git'))return;
  e.preventDefault();
  S.files=parseDiff(t);S.active=0;S.comments={};S.editing=null;S.reviewed={};S.reverted={};S.expanded={};
  document.getElementById('paste-overlay').classList.add('hidden');render();
});

render();
</script>
</body>
</html>
